# Inert template: nothing in the VegaJet tree installs or applies sysctl values. Copy by hand after review.
#
# Anti-wedge posture: a stuck task, soft lockup or OOM should leave evidence in the journal and keep the host
# reachable for inspection, rather than hard-panicking during a long GPU run. These are conservative starting
# points, not tuned values.

# Log a hung task after two minutes instead of waiting indefinitely.
kernel.hung_task_timeout_secs = 120
# Record hung tasks and watchdog events; do not panic the host on them.
kernel.hung_task_panic = 0
kernel.watchdog_thresh = 10
kernel.softlockup_panic = 0
kernel.panic_on_oops = 0
# Keep the OOM killer from panicking the machine, so the killed process is visible.
vm.panic_on_oom = 0
