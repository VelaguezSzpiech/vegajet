name: ci
on:
  push:
  pull_request:
jobs:
  cpu:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history for the git log -p leak audit
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake ninja-build g++
      - name: Configure (CPU only)
        run: cmake -S . -B build-cpu -G Ninja -DVEGAJET_CPU_ONLY=ON
      - name: Build
        run: cmake --build build-cpu -j
      - name: Test
        run: ctest --test-dir build-cpu --output-on-failure
      - name: Privacy / leak audit
        run: tools/privacy_audit.sh
      - name: Verify harness (CPU gates)
        run: python3 agent/verify_model.py --build build-cpu
